name: Build and Push Mem0 to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (e.g., "staging", "debug"). Defaults to branch name.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mbtamuli

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: mem0
            dockerfile: server/Dockerfile
            context: .
            image_suffix: ''
            test_cmd: ['uvicorn', '--help']
          - name: mem0-dashboard
            dockerfile: server/dashboard/Dockerfile
            context: server/dashboard
            image_suffix: '-dashboard'
            test_cmd: ['node', '--version']

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.target.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Mem0 ${{ matrix.target.name }}
            org.opencontainers.image.description=Mem0 self-hosted ${{ matrix.target.name }} image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (PR only)
        if: github.event_name == 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.target.name }}:${{ steps.meta.outputs.version }}"
          docker run --rm "$IMAGE" ${{ join(matrix.target.test_cmd, ' ') }}
          echo "Smoke test passed for ${{ matrix.target.name }}"

      - name: Smoke test (push)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.target.name }}:${{ steps.meta.outputs.version }}"
          docker run --rm "$IMAGE" ${{ join(matrix.target.test_cmd, ' ') }}
          echo "Smoke test passed for ${{ matrix.target.name }}"
